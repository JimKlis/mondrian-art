<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0;
    }

    .black-container {
      width: 748px;
      height: 746px;
      background-color: #000;
    }

    .container {
      display: grid;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 20px;
      gap: 9px;
    }

    .title {
      text-align: center;
      font-family: Garamond;
      font-size: 15px;
      margin-right: 40px;
    }

    .year {
      font-style: italic;
    }

    .red {
      background-color: #E72F24;
    }

    .white {
      background-color: #F0F1EC;
    }

    .blue {
      background-color: #004592;
    }

    .yellow {
      background-color: #F9D01E;
    }

    .black {
      background-color: #232629;
    }

    #second {
      grid-column: span 3;
    }

    #third {
      grid-row: span 2;
    }

    #fourth {
      grid-column: span 2;
      grid-row: span 2;
    }

    #sixth {
      grid-row: span 2;
      margin-top: 10px;
    }

  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <p class="title">Composition C (No.III) with Red, Yellow and Blue <br/><span class="year">(1935)</span></p>
   <div class="black-container">
    <div class="container">
      <div class="box red" id="first"></div>
      <div class="box white" id="second"></div>
      <div class="box white" id="third"></div>
      <div class="box white" id="fourth"></div>
      <div class="box blue" id="fifth"></div>
      <div class="box white" id="sixth"></div>
      <div class="box white" id="seventh"></div>
      <div class="box yellow" id="eighth"></div>
      <div class="box black" id="ninth"></div>
    </div>
   </div>
</body>

</html>
